spring.application.name=foodexpress-backend
server.port=8080

# MySQL configuration for FoodExpress
# Create database manually first: CREATE DATABASE foodexpress_db;
# Then set these environment variables in your OS or IDE run configuration.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/foodexpress_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:your_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Optional: enable the H2 console only if you decide to test with H2 later.
# spring.h2.console.enabled=true
# spring.h2.console.path=/h2-console

# JWT settings
jwt.secret=${JWT_SECRET:foodexpress-super-secret-key-change-in-production-123456}
jwt.expiration=${JWT_EXPIRATION:86400000}
